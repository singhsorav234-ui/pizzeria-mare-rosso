            function filterCategory(category, clickedButton) {
                // Rimuove la classe 'active' da tutti i bottoni
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                
                // Se viene passato il bottone cliccato, lo attiva; altrimenti attiva il primo (Pizze)
                if (clickedButton) {
                    clickedButton.classList.add('active');
                } else {
                    document.querySelector('.tab-btn').classList.add('active');
                }

                const listContainer = document.getElementById('items-list');
                listContainer.innerHTML = '';

                // Mostra i prodotti della categoria
                menuData[category].forEach((item, index) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'menu-item-box';
                    itemDiv.innerHTML = `<span><strong>${item.name}</strong></span> <span>${item.price}</span>`;

                    // Al passaggio del mouse cambia l'immagine
                    itemDiv.onmouseenter = () => {
                        document.getElementById('preview-img').src = item.img;
                    };

                    listContainer.appendChild(itemDiv);
                });

                // Imposta l'immagine del primo elemento come anteprima iniziale
                if (menuData[category].length > 0) {
                    document.getElementById('preview-img').src = menuData[category][0].img;
                }
            }

            // Avvia la pagina mostrando le pizze
            filterCategory('pizze', document.querySelector('.tab-btn'));
        </script>
